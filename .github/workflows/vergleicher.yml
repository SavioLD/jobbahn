# Testet den Vergleicher bei jeder Änderung und deployt ihn zu Cloudflare,
# sobald das Secret CLOUDFLARE_API_TOKEN hinterlegt ist (Account-ID steht in wrangler.toml).
# Einrichtung Schritt für Schritt: vergleicher/README.md
name: Vergleicher

on:
  push:
    branches: [main]
    paths:
      - "vergleicher/**"
      - "config/berufe.json"
      - "schema/felder.json"
      - ".github/workflows/vergleicher.yml"
  workflow_dispatch:

concurrency:
  group: vergleicher
  cancel-in-progress: false

jobs:
  testen-und-deployen:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vergleicher
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WRANGLER: npx --yes wrangler@4.151.3
      # Bewerberdaten bleiben in der EU (D1 mit --jurisdiction eu)
      DB_NAME: passtjob-eu
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tests
        run: npm test

      - name: Cloudflare-Zugang vorhanden?
        id: zugang
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Kein Cloudflare-Zugang hinterlegt – Tests sind gelaufen, Deploy übersprungen. Einrichtung: vergleicher/README.md"
          fi

      - name: Datenbank finden oder anlegen
        if: steps.zugang.outputs.ok == 'true'
        run: |
          finde() {
            $WRANGLER d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const t=s.slice(s.indexOf("["),s.lastIndexOf("]")+1);const d=JSON.parse(t||"[]").find(x=>x.name===process.env.DB_NAME);process.stdout.write(d?d.uuid:"")})'
          }
          ID=$(finde)
          if [ -z "$ID" ]; then $WRANGLER d1 create "$DB_NAME" --jurisdiction eu; ID=$(finde); fi
          if [ -z "$ID" ]; then echo "::error::Die D1-Datenbank „$DB_NAME“ konnte nicht gefunden oder angelegt werden."; exit 1; fi
          sed -i -e "s/DATABASE_ID_HIER/$ID/" -e "s/^database_name = .*/database_name = \"$DB_NAME\"/" wrangler.toml
          echo "Datenbank: $ID"

      - name: Tabellen anlegen oder aktualisieren
        if: steps.zugang.outputs.ok == 'true'
        run: $WRANGLER d1 migrations apply "$DB_NAME" --remote

      - name: Deploy
        id: deploy
        if: steps.zugang.outputs.ok == 'true'
        run: |
          set -o pipefail
          $WRANGLER deploy | tee deploy.log
          ADRESSE=$(grep -o 'https://[^ ]*\.workers\.dev' deploy.log | head -1)
          echo "adresse=$ADRESSE" >> "$GITHUB_OUTPUT"
          echo "::notice::Vergleicher: $ADRESSE/intern"

      - name: Passwort für /intern setzen
        if: steps.zugang.outputs.ok == 'true'
        env:
          PASSWORT: ${{ secrets.VERGLEICHER_PASSWORT }}
        run: |
          if [ -n "$PASSWORT" ]; then
            printf '%s' "$PASSWORT" | $WRANGLER secret put ADMIN_TOKEN
          else
            echo "::warning::Secret VERGLEICHER_PASSWORT fehlt – der interne Bereich bleibt gesperrt, bis es gesetzt ist."
          fi

      - name: Läuft er?
        if: steps.zugang.outputs.ok == 'true' && steps.deploy.outputs.adresse != ''
        env:
          ADRESSE: ${{ steps.deploy.outputs.adresse }}
          PASSWORT: ${{ secrets.VERGLEICHER_PASSWORT }}
        run: |
          # Eine neue workers.dev-Adresse braucht beim ersten Mal ein paar Minuten
          for i in $(seq 1 30); do
            curl -fsS "$ADRESSE/api/ping" >/dev/null 2>&1 && break
            sleep 10
          done
          code() { curl -sS -o /dev/null -w '%{http_code}' "$@" || true; }
          PING=$(code "$ADRESSE/api/ping")
          OHNE=$(code "$ADRESSE/api/intern/uebersicht")
          echo "Erreichbar: $PING · ohne Passwort: $OHNE (soll 401 sein)"
          if [ "$PING" != "200" ]; then echo "::warning::$ADRESSE antwortet noch nicht (Status $PING). Bei einer neuen workers.dev-Adresse kann das ein paar Minuten dauern."; exit 0; fi
          if [ "$OHNE" != "401" ]; then echo "::error::Der interne Bereich ist nicht geschützt (Status $OHNE)."; exit 1; fi
          if [ -n "$PASSWORT" ]; then
            MIT=$(code -H "Authorization: Bearer $PASSWORT" "$ADRESSE/api/intern/uebersicht")
            echo "Mit Passwort + Datenbank: $MIT (soll 200 sein)"
            if [ "$MIT" != "200" ]; then echo "::error::Anmeldung oder Datenbank funktioniert nicht (Status $MIT)."; exit 1; fi
          fi
          echo "::notice::Vergleicher läuft: $ADRESSE/intern"
